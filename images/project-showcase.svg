<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0E7FF"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="line" x1="140" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="640" rx="32" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="90" y="86" width="1020" height="468" rx="24" fill="white"/>
  </g>

  <text x="140" y="150" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Project Execution Roadmap</text>
  <text x="140" y="184" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">Strategy to milestones with cross-functional alignment</text>

  <line x1="140" y1="300" x2="1040" y2="300" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>

  <g>
    <circle cx="200" cy="300" r="18" fill="#6366F1"/>
    <rect x="156" y="338" width="88" height="56" rx="12" fill="#EEF2FF"/>
    <text x="173" y="371" fill="#3730A3" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Plan</text>
  </g>

  <g>
    <circle cx="470" cy="300" r="18" fill="#0EA5E9"/>
    <rect x="421" y="338" width="98" height="56" rx="12" fill="#E0F2FE"/>
    <text x="435" y="371" fill="#075985" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Build</text>
  </g>

  <g>
    <circle cx="730" cy="300" r="18" fill="#10B981"/>
    <rect x="677" y="338" width="106" height="56" rx="12" fill="#DCFCE7"/>
    <text x="691" y="371" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Validate</text>
  </g>

  <g>
    <circle cx="980" cy="300" r="18" fill="#F59E0B"/>
    <rect x="922" y="338" width="116" height="56" rx="12" fill="#FEF3C7"/>
    <text x="937" y="371" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Launch</text>
  </g>

  <rect x="140" y="220" width="260" height="44" rx="10" fill="#F8FAFC"/>
  <text x="160" y="248" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">Technical Strategy</text>

  <rect x="430" y="220" width="300" height="44" rx="10" fill="#F8FAFC"/>
  <text x="450" y="248" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">Engineering + Product Sync</text>

  <rect x="760" y="220" width="280" height="44" rx="10" fill="#F8FAFC"/>
  <text x="780" y="248" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">Data-Driven Decisions</text>
</svg>
